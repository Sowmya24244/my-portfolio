<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <title>Handmade Crafts Gallery | Maradani Baby Sowmya Sri</title>
    <meta name="description"
        content="Handmade crafts gallery by Maradani Baby Sowmya Sri showcasing silk thread rings, handmade jewelry, and decorative crafts.">
    <meta name="author" content="Maradani Baby Sowmya Sri">

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- External JavaScript File -->
    <script src="js/script.js" defer></script>
</head>

<body class="crafts-page-body">

    <!-- Header Navigation with Back Button -->
    <header class="crafts-header">
        <div class="container crafts-header-container">
            <a href="index.html#hobbies" class="btn btn-back" aria-label="Back to Hobbies section on portfolio">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Back to Hobbies</span>
            </a>
            <span class="crafts-brand">Handmade Crafts Gallery</span>
        </div>
    </header>

    <!-- Main Crafts Content (Pictures Only - No Text Descriptions or Captions) -->
    <main class="crafts-main container">

        <!-- Responsive Image Gallery Grid -->
        <div class="crafts-standalone-grid">
            
            <!-- Craft Picture 1 -->
            <div class="craft-photo-card" tabindex="0" role="button" aria-label="View enlarged craft photograph 1"
                data-src="assets/images/crafting/craft-1.jpeg">
                <div class="craft-photo-wrapper">
                    <img src="assets/images/crafting/craft-1.jpeg" alt="Handmade craft photograph 1" loading="lazy"
                        class="craft-photo">
                    <div class="craft-photo-overlay">
                        <span class="photo-zoom-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                <line x1="11" y1="8" x2="11" y2="14"></line>
                                <line x1="8" y1="11" x2="14" y2="11"></line>
                            </svg>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Craft Picture 2 -->
            <div class="craft-photo-card" tabindex="0" role="button" aria-label="View enlarged craft photograph 2"
                data-src="assets/images/crafting/craft-2.jpeg">
                <div class="craft-photo-wrapper">
                    <img src="assets/images/crafting/craft-2.jpeg" alt="Handmade craft photograph 2" loading="lazy"
                        class="craft-photo">
                    <div class="craft-photo-overlay">
                        <span class="photo-zoom-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                <line x1="11" y1="8" x2="11" y2="14"></line>
                                <line x1="8" y1="11" x2="14" y2="11"></line>
                            </svg>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Craft Picture 3 -->
            <div class="craft-photo-card" tabindex="0" role="button" aria-label="View enlarged craft photograph 3"
                data-src="assets/images/crafting/craft-3.jpeg">
                <div class="craft-photo-wrapper">
                    <img src="assets/images/crafting/craft-3.jpeg" alt="Handmade craft photograph 3" loading="lazy"
                        class="craft-photo">
                    <div class="craft-photo-overlay">
                        <span class="photo-zoom-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                <line x1="11" y1="8" x2="11" y2="14"></line>
                                <line x1="8" y1="11" x2="14" y2="11"></line>
                            </svg>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Craft Picture 4 -->
            <div class="craft-photo-card" tabindex="0" role="button" aria-label="View enlarged craft photograph 4"
                data-src="assets/images/crafting/craft-4.jpeg">
                <div class="craft-photo-wrapper">
                    <img src="assets/images/crafting/craft-4.jpeg" alt="Handmade craft photograph 4" loading="lazy"
                        class="craft-photo">
                    <div class="craft-photo-overlay">
                        <span class="photo-zoom-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                <line x1="11" y1="8" x2="11" y2="14"></line>
                                <line x1="8" y1="11" x2="14" y2="11"></line>
                            </svg>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Craft Picture 5 -->
            <div class="craft-photo-card" tabindex="0" role="button" aria-label="View enlarged craft photograph 5"
                data-src="assets/images/crafting/craft-5.jpeg">
                <div class="craft-photo-wrapper">
                    <img src="assets/images/crafting/craft-5.jpeg" alt="Handmade craft photograph 5" loading="lazy"
                        class="craft-photo">
                    <div class="craft-photo-overlay">
                        <span class="photo-zoom-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                <line x1="11" y1="8" x2="11" y2="14"></line>
                                <line x1="8" y1="11" x2="14" y2="11"></line>
                            </svg>
                        </span>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Lightbox Modal for Full-Size Viewing (Clean - No Text Captions) -->
    <div id="craftLightbox" class="lightbox-modal" aria-hidden="true" role="dialog" aria-modal="true"
        aria-label="Full-size craft view">
        <div class="lightbox-overlay" id="lightboxOverlay"></div>
        <div class="lightbox-content lightbox-content-clean">
            <button type="button" class="lightbox-close-btn" id="lightboxCloseBtn"
                aria-label="Close full-size image lightbox">&times;</button>
            <div class="lightbox-img-container">
                <img id="lightboxImg" src="" alt="Full size craft photograph" class="lightbox-img">
            </div>
        </div>
    </div>

</body>

</html>
