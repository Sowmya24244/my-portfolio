<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Viewer | Maradani Baby Sowmya Sri</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: var(--bg-main, #0B1120);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-main, #F8FAFC);
        }

        .viewer-header {
            background-color: rgba(11, 17, 32, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color, rgba(37, 99, 235, 0.35));
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .viewer-header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .viewer-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .viewer-title {
            font-size: 1.15rem;
            color: var(--heading-blue, #60A5FA);
            font-weight: 700;
            margin: 0;
            line-height: 1.3;
        }

        .viewer-main {
            flex: 1;
            padding: 2rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .viewer-card {
            background-color: var(--card-bg, #151F33);
            border: 1px solid var(--border-color, rgba(37, 99, 235, 0.35));
            border-radius: var(--border-radius, 16px);
            padding: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            max-width: 950px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .viewer-img {
            width: 100%;
            height: auto;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid var(--border-color, rgba(37, 99, 235, 0.35));
            display: block;
        }

        @media (max-width: 640px) {
            .viewer-header-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }

            .viewer-title {
                font-size: 1rem;
            }

            .viewer-card {
                padding: 0.75rem;
            }
        }
    </style>
</head>

<body>

    <header class="viewer-header">
        <div class="container viewer-header-container">
            <button id="backBtn" class="btn btn-outline btn-sm viewer-back-btn" aria-label="Return to portfolio">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Portfolio
            </button>
            <h1 id="certTitle" class="viewer-title">Certificate Viewer</h1>
        </div>
    </header>

    <main class="viewer-main">
        <div class="container text-center">
            <div class="viewer-card">
                <img id="certImg" src="" alt="Certificate Display" class="viewer-img">
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const certKey = params.get('cert');

            const certData = {
                'eduskills': {
                    title: 'Virtual Internship – AI/ML Certificate (EduSkills — AWS Academy — AICTE)',
                    image: 'assets/certificates/eduskills-ai-ml-certificate.png',
                    alt: 'EduSkills AWS Academy Virtual Internship AI/ML Certificate for Maradani Baby Sowmya Sri',
                    sectionHash: '#experience'
                },
                'linguaskill': {
                    title: 'Linguaskill General – English Language Assessment (Cambridge English)',
                    image: 'assets/certificates/linguaskill-certificate.png',
                    alt: 'Linguaskill General English language test report showing an overall CEFR level of B2',
                    sectionHash: '#certifications'
                }
            };

            const cert = certData[certKey] || certData['eduskills'];

            document.title = `${cert.title} | Maradani Baby Sowmya Sri`;
            document.getElementById('certTitle').textContent = cert.title;

            const certImg = document.getElementById('certImg');
            certImg.src = cert.image;
            certImg.alt = cert.alt;

            const backBtn = document.getElementById('backBtn');
            backBtn.addEventListener('click', () => {
                if (window.opener && !window.opener.closed) {
                    try {
                        window.opener.focus();
                        window.close();
                        return;
                    } catch (e) {
                        // Fallback navigation if opener focus is restricted by browser
                    }
                }
                window.location.href = `index.html${cert.sectionHash}`;
            });
        });
    </script>
</body>

</html>
